name: Bug report
description: Report reproducible incorrect behavior in Obsidian MCP
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Obsidian MCP. Do not include note content, personal vault paths, or credentials.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - VS Code
        - Claude Desktop
        - Other
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior without including private note content.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure the server with...
        2. Call the tool...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact note content, usernames, filesystem paths, hostnames, and credentials.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed private note content and personal paths from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
