[project]
name = "obsidian-mcp"
version = "0.1.1"
description = "Local filesystem MCP server for securely working with Obsidian vaults"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Torsten Mahr" }]
keywords = ["fastmcp", "markdown", "mcp", "model-context-protocol", "obsidian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "fastmcp>=2.0,<4.0",
]

[project.urls]
Changelog = "https://github.com/trsdn/obsidian-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/trsdn/obsidian-mcp#readme"
Issues = "https://github.com/trsdn/obsidian-mcp/issues"
Repository = "https://github.com/trsdn/obsidian-mcp"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
